name: tests

# Runs on every push and pull request. Needs no secrets: the tests never touch
# the network or Gemini.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Naughty-list self-check
        run: python naughty_list.py
      - name: Tests
        run: python -m pytest -q
